name: compliance

on:
  push:
  pull_request:

jobs:
  banned-claims:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fail on em dashes and banned claims
        run: python3 scripts/check_compliance.py
